name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

      - name: Configure npm with Artifactory
        run: |
          jf npmc \
            --repo-resolve npm-virtual \
            --repo-deploy npm-local \
            --server-id-resolve setup-jfrog-cli-server \
            --server-id-deploy setup-jfrog-cli-server

      - name: Create npm cache folder
        run: mkdir -p /home/runner/.npm/_cacache

      - name: Install dependencies
        run: jf npm install --build-name=${{ github.repository }} --build-number=${{ github.run_number }}

      - name: Run tests
        run: npm test

      # ── Scan 1: audit your source code and dependencies ──────────────────
      - name: Audit dependencies (jf audit)
        run: jf audit --npm

      # ── Scan 2: scan the package file before publishing ──────────────────
      - name: Build package
        run: npm pack

      - name: Scan package file (jf scan)
        run: jf scan "*.tgz"

      # ── Publish ──────────────────────────────────────────────────────────
      - name: Publish to Artifactory
        if: github.ref == 'refs/heads/main'
        run: jf npm publish --build-name=${{ github.repository }} --build-number=${{ github.run_number }}

      - name: Publish build info
        if: github.ref == 'refs/heads/main'
        run: jf rt build-publish ${{ github.repository }} ${{ github.run_number }}

      # ── Scan 3: scan the full build in Artifactory after publishing ───────
      - name: Build scan (jf build-scan)
        if: github.ref == 'refs/heads/main'
        run: jf build-scan ${{ github.repository }} ${{ github.run_number }}
